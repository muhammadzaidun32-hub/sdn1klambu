<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <circle cx="1010" cy="110" r="62" fill="#fbbf24" opacity="0.9"/>
  <circle cx="1010" cy="110" r="86" fill="#fbbf24" opacity="0.18"/>
  <ellipse cx="210" cy="120" rx="95" ry="34" fill="#fff" opacity="0.85"/>
  <ellipse cx="300" cy="135" rx="65" ry="26" fill="#fff" opacity="0.75"/>
  <ellipse cx="700" cy="95" rx="110" ry="36" fill="#fff" opacity="0.8"/>

  <!-- hills -->
  <path d="M0 560 Q300 460 620 545 T1200 520 V700 H0 Z" fill="#a7d99a"/>
  <path d="M0 620 Q400 540 800 610 T1200 600 V700 H0 Z" fill="#8bc97f"/>

  <!-- trees -->
  <g>
    <rect x="86" y="470" width="18" height="70" rx="8" fill="#8a5a33"/>
    <circle cx="95" cy="440" r="58" fill="#4f9d5d"/>
    <circle cx="60" cy="470" r="38" fill="#57a866"/>
    <circle cx="132" cy="472" r="40" fill="#57a866"/>
  </g>
  <g>
    <rect x="1085" y="485" width="16" height="60" rx="8" fill="#8a5a33"/>
    <circle cx="1093" cy="455" r="50" fill="#4f9d5d"/>
    <circle cx="1062" cy="482" r="32" fill="#57a866"/>
    <circle cx="1124" cy="483" r="34" fill="#57a866"/>
  </g>

  <!-- school flag pole -->
  <rect x="585" y="300" width="8" height="270" rx="4" fill="#94a3b8"/>
  <path d="M593 302 L688 322 L593 344 Z" fill="#e11d48"/>

  <!-- main building -->
  <g>
    <!-- terrace -->
    <rect x="360" y="560" width="480" height="14" rx="6" fill="#c8d3e0"/>
    <!-- base -->
    <rect x="390" y="380" width="420" height="185" rx="10" fill="url(#wall)" stroke="#cbd5e1" stroke-width="3"/>
    <!-- roof -->
    <path d="M368 380 L600 268 L832 380 Z" fill="#1d4ed8"/>
    <path d="M368 380 L600 268 L832 380 Z" fill="#1e40af" opacity="0.15"/>
    <rect x="360" y="372" width="480" height="16" rx="8" fill="#1e40af"/>
    <!-- hero sign -->
    <rect x="520" y="404" width="160" height="44" rx="10" fill="#f59e0b"/>
    <text x="600" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff">SDN 1 KLAMBU</text>
    <!-- door -->
    <rect x="568" y="465" width="64" height="100" rx="8" fill="#0f2a5c"/>
    <circle cx="622" cy="518" r="4" fill="#fbbf24"/>
    <!-- windows -->
    <g fill="#7db3e8" stroke="#3b82f6" stroke-width="4">
      <rect x="420" y="462" width="72" height="58" rx="6"/>
      <rect x="708" y="462" width="72" height="58" rx="6"/>
    </g>
    <g stroke="#dbeafe" stroke-width="3">
      <line x1="456" y1="462" x2="456" y2="520"/>
      <line x1="744" y1="462" x2="744" y2="520"/>
    </g>
  </g>

  <!-- flag kids line -->
  <g font-family="Arial, sans-serif">
    <!-- simple flat students -->
    <g transform="translate(180 540)">
      <circle cx="0" cy="0" r="20" fill="#fcd0ae"/>
      <path d="M-20 -4 A20 20 0 0 1 20 -4 L20 -12 A20 20 0 0 0 -20 -12 Z" fill="#1f2937"/>
      <rect x="-22" y="22" width="44" height="52" rx="14" fill="#dc2626"/>
      <rect x="-16" y="74" width="12" height="34" rx="6" fill="#1e3a8a"/>
      <rect x="4" y="74" width="12" height="34" rx="6" fill="#1e3a8a"/>
    </g>
    <g transform="translate(885 545)">
      <circle cx="0" cy="0" r="20" fill="#e8b48c"/>
      <path d="M-20 -6 A20 20 0 0 1 20 -6 L22 -14 A20 20 0 0 0 -22 -14 Z" fill="#4c2a12"/>
      <rect x="-22" y="22" width="44" height="52" rx="14" fill="#2563eb"/>
      <rect x="-16" y="74" width="12" height="34" rx="6" fill="#334155"/>
      <rect x="4" y="74" width="12" height="34" rx="6" fill="#334155"/>
    </g>
  </g>

  <!-- birds -->
  <g stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M420 130 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M540 88 q12 -13 24 0 q12 -13 24 0"/>
  </g>
</svg>
