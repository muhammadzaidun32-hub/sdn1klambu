<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Berita: P5 Wirausaha Muda (bazar) -->
  <rect width="800" height="600" fill="#ecfeff"/>
  <path d="M0 480 Q400 430 800 480 V600 H0 Z" fill="#a5d8f3"/>

  <!-- stall -->
  <rect x="150" y="220" width="500" height="40" rx="10" fill="#0f766e"/>
  <g>
    <path d="M150 220 L210 170 L270 220 Z" fill="#ef4444"/>
    <path d="M270 220 L330 170 L390 220 Z" fill="#f59e0b"/>
    <path d="M390 220 L450 170 L510 220 Z" fill="#22c55e"/>
    <path d="M510 220 L570 170 L630 220 Z" fill="#3b82f6"/>
  </g>
  <rect x="170" y="260" width="20" height="240" fill="#92400e"/>
  <rect x="610" y="260" width="20" height="240" fill="#92400e"/>
  <rect x="150" y="360" width="500" height="18" rx="9" fill="#b45309"/>

  <!-- goods on table -->
  <g>
    <circle cx="230" cy="340" r="18" fill="#ef4444"/>
    <circle cx="270" cy="344" r="16" fill="#f97316"/>
    <rect x="310" y="320" width="34" height="40" rx="6" fill="#a855f7"/>
    <rect x="354" y="328" width="30" height="32" rx="6" fill="#14b8a6"/>
    <path d="M430 360 l16 -34 16 34 z" fill="#facc15"/>
    <path d="M470 360 l16 -34 16 34 z" fill="#38bdf8"/>
    <circle cx="560" cy="342" r="18" fill="#22c55e"/>
    <circle cx="598" cy="346" r="14" fill="#ec4899"/>
  </g>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f766e">BAZAR SISWA</text>

  <!-- seller kid -->
  <g transform="translate(300 500)">
    <circle cx="0" cy="-50" r="30" fill="#fcd0ae"/>
    <path d="M-30 -54 A30 30 0 0 1 30 -54 L30 -68 A30 30 0 0 0 -30 -68 Z" fill="#111827"/>
    <rect x="-34" y="-14" width="68" height="84" rx="22" fill="#f59e0b"/>
    <rect x="26" y="-40" width="13" height="60" rx="6" fill="#fcd0ae" transform="rotate(-38 26 -40)"/>
  </g>
  <!-- buyer kid -->
  <g transform="translate(500 505)">
    <circle cx="0" cy="-46" r="28" fill="#e8b48c"/>
    <path d="M-28 -34 A28 28 0 0 1 28 -34 L28 -50 A28 28 0 0 0 -28 -50 Z" fill="#4c2a12"/>
    <rect x="-32" y="-12" width="64" height="80" rx="20" fill="#8b5cf6"/>
  </g>
</svg>
