<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- SDN 1 Klambu tampak depan untuk halaman profil -->
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5cdf5"/><stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky2)"/>
  <circle cx="180" cy="130" r="58" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="850" cy="110" rx="110" ry="34" fill="#fff" opacity="0.85"/>
  <ellipse cx="960" cy="130" rx="70" ry="26" fill="#fff" opacity="0.7"/>

  <!-- ground -->
  <rect y="640" width="1200" height="160" fill="#8bc97f"/>
  <path d="M0 640 Q600 600 1200 640 V800 H0 Z" fill="#95cf8b"/>

  <!-- building -->
  <g>
    <rect x="250" y="330" width="700" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- roof band -->
    <rect x="230" y="300" width="740" height="42" rx="10" fill="#1e40af"/>
    <path d="M270 300 L600 200 L930 300 Z" fill="#1d4ed8"/>
    <!-- sign -->
    <rect x="470" y="368" width="260" height="56" rx="12" fill="#f59e0b"/>
    <text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#fff">SDN 1 KLAMBU</text>
    <!-- door -->
    <rect x="556" y="470" width="88" height="180" rx="10" fill="#0f2a5c"/>
    <circle cx="628" cy="566" r="5" fill="#fbbf24"/>
    <!-- windows 2 floors -->
    <g fill="#7db3e8" stroke="#3b82f6" stroke-width="5">
      <rect x="310" y="380" width="86" height="66" rx="8"/>
      <rect x="804" y="380" width="86" height="66" rx="8"/>
      <rect x="310" y="500" width="86" height="70" rx="8"/>
      <rect x="804" y="500" width="86" height="70" rx="8"/>
      <rect x="430" y="500" width="86" height="70" rx="8"/>
      <rect x="684" y="500" width="86" height="70" rx="8"/>
    </g>
    <!-- flag -->
    <rect x="240" y="240" width="8" height="400" rx="4" fill="#94a3b8"/>
    <path d="M248 244 L340 266 L248 290 Z" fill="#e11d48"/>
  </g>

  <!-- garden bushes -->
  <circle cx="180" cy="648" r="46" fill="#4f9d5d"/>
  <circle cx="238" cy="660" r="34" fill="#57a866"/>
  <circle cx="1020" cy="650" r="46" fill="#4f9d5d"/>
  <circle cx="962" cy="662" r="34" fill="#57a866"/>

  <!-- students walking -->
  <g transform="translate(150 560)">
    <circle cx="0" cy="-36" r="26" fill="#fcd0ae"/>
    <path d="M-26 -40 A26 26 0 0 1 26 -40 L26 -52 A26 26 0 0 0 -26 -52 Z" fill="#111827"/>
    <rect x="-30" y="-4" width="60" height="74" rx="20" fill="#dc2626"/>
    <path d="M-22 70 L-30 108 M-22 70 L-8 108 M10 70 L0 108 M10 70 L26 108" stroke="#1e3a8a" stroke-width="13" stroke-linecap="round"/>
    <rect x="-34" y="14" width="20" height="26" rx="6" fill="#fff"/>
  </g>
  <g transform="translate(1070 570)">
    <circle cx="0" cy="-36" r="26" fill="#e8b48c"/>
    <path d="M-26 -40 A26 26 0 0 1 26 -40 L26 -52 A26 26 0 0 0 -26 -52 Z" fill="#4c2a12"/>
    <rect x="-30" y="-4" width="60" height="74" rx="20" fill="#2563eb"/>
    <path d="M-24 70 L-32 108 M-24 70 L-10 108 M12 70 L2 108 M12 70 L28 108" stroke="#334155" stroke-width="13" stroke-linecap="round"/>
    <rect x="-34" y="14" width="20" height="26" rx="6" fill="#fff"/>
  </g>
</svg>
