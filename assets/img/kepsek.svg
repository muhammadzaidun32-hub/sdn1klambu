<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720">
  <!-- Ilustrasi potret Kepala Sekolah -->
  <defs>
    <linearGradient id="bgk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0f2a5c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="720" fill="url(#bgk)"/>
  <circle cx="540" cy="90" r="90" fill="#fbbf24" opacity="0.15"/>
  <circle cx="90" cy="620" r="70" fill="#ffffff" opacity="0.06"/>

  <!-- body: batik-style blazer -->
  <g transform="translate(320 430)">
    <path d="M-150 290 C-150 130 -90 60 0 60 C90 60 150 130 150 290 Z" fill="#0b1f45"/>
    <!-- batik scarf -->
    <path d="M-70 60 L0 150 L70 60 L46 48 L0 96 L-46 48 Z" fill="#b45309"/>
    <g fill="#fbbf24" opacity="0.85">
      <circle cx="-34" cy="120" r="5"/><circle cx="34" cy="120" r="5"/>
      <circle cx="0" cy="170" r="5"/><circle cx="-40" cy="210" r="5"/><circle cx="40" cy="210" r="5"/>
    </g>
    <!-- shirt collar -->
    <path d="M-34 58 L0 108 L34 58 L20 44 L0 74 L-20 44 Z" fill="#fff"/>
  </g>

  <!-- head -->
  <g transform="translate(320 250)">
    <ellipse cx="0" cy="10" rx="105" ry="112" fill="#f2c19b"/>
    <!-- hair bun -->
    <circle cx="0" cy="-96" r="0" />
    <path d="M-104 -8 C-108 -110 108 -110 104 -8 C100 -60 60 -84 0 -84 C-60 -84 -100 -60 -104 -8 Z" fill="#2b1a10"/>
    <circle cx="0" cy="-108" r="34" fill="#2b1a10"/>
    <!-- ears -->
    <circle cx="-103" cy="16" r="14" fill="#eab389"/>
    <circle cx="103" cy="16" r="14" fill="#eab389"/>
    <!-- earrings -->
    <circle cx="-103" cy="34" r="6" fill="#fbbf24"/>
    <circle cx="103" cy="34" r="6" fill="#fbbf24"/>
    <!-- eyes -->
    <circle cx="-36" cy="6" r="7" fill="#1f2937"/>
    <circle cx="36" cy="6" r="7" fill="#1f2937"/>
    <path d="M-48 -8 q12 -8 24 -2 M48 -8 q-12 -8 -24 -2" stroke="#2b1a10" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M-24 52 Q0 74 24 52" stroke="#a15c3b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="-62" cy="34" rx="14" ry="8" fill="#f2a58c" opacity="0.6"/>
    <ellipse cx="62" cy="34" rx="14" ry="8" fill="#f2a58c" opacity="0.6"/>
    <!-- glasses -->
    <g stroke="#334155" stroke-width="5" fill="none">
      <circle cx="-36" cy="6" r="20"/>
      <circle cx="36" cy="6" r="20"/>
      <line x1="-16" y1="6" x2="16" y2="6"/>
    </g>
  </g>

  <!-- ID card -->
  <g transform="translate(320 640)">
    <rect x="-90" y="-34" width="180" height="60" rx="12" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f2a5c">NURANIS, S.Pd.SD</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Kepala SDN 1 Klambu</text>
  </g>
</svg>
