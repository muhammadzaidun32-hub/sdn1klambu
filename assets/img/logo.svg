    <path d="M-150 -10 C-110 -30 -60 -30 -8 -8 L-8 42 C-60 24 -110 24 -150 40 Z" fill="#f8fafc"/>
    <path d="M150 -10 C110 -30 60 -30 -8 -8 L-8 42 C60 24 110 24 150 40 Z" fill="#dbe7f7"/>
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="-128" y1="8" x2="-56" y2="18"/>
      <line x1="-128" y1="30" x2="-56" y2="40"/>
      <line x1="128" y1="8" x2="52" y2="18"/>
      <line x1="128" y1="30" x2="52" y2="40"/>
    </g>
  </g>
  <!-- Torch of knowledge -->
