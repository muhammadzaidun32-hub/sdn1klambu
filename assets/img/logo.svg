  <!-- Text banners -->
  <text x="256" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="2">SDN 1</text>
  <text x="256" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="4">KLAMBU</text>
