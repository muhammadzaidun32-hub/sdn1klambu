    <path d="M0 -92 C26 -66 42 -44 42 -20 A42 44 0 1 1 -42 -20 C-42 -44 -26 -66 0 -92 Z" fill="#f59e0b"/>
    <path d="M0 -66 C10 -52 18 -40 18 -22 A18 20 0 1 1 -18 -22 C-18 -40 -14 -52 0 -66 Z" fill="#fef08a"/>
