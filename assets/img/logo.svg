<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SDN 1 Klambu school emblem -->
  <defs>
    <linearGradient id="gradBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gradShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Outer shield -->
  <path d="M256 16 L476 64 V280 C476 416 372 468 256 496 C140 468 76 416 36 280 V64 Z"
