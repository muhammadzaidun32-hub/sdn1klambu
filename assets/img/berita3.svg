<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Berita: Prestasi O2SN medali -->
  <rect width="800" height="600" fill="#f0fdf4"/>
  <path d="M0 490 Q400 440 800 490 V600 H0 Z" fill="#bbf7d0"/>
  <circle cx="100" cy="90" r="44" fill="#fbbf24" opacity="0.85"/>

  <!-- podium -->
  <rect x="300" y="360" width="200" height="150" rx="12" fill="#fbbf24"/>
  <text x="400" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#92400e">1</text>
  <rect x="140" y="410" width="160" height="100" rx="12" fill="#cbd5e1"/>
  <text x="220" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#475569">2</text>
  <rect x="500" y="410" width="160" height="100" rx="12" fill="#fdba74"/>
  <text x="580" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#7c2d12">3</text>

  <!-- champion kid with medal -->
  <g transform="translate(400 220)">
    <circle cx="0" cy="-30" r="38" fill="#fcd0ae"/>
    <path d="M-38 -34 A38 38 0 0 1 38 -34 L38 -52 A38 38 0 0 0 -38 -52 Z" fill="#111827"/>
    <circle cx="-13" cy="-34" r="5" fill="#1f2937"/>
    <circle cx="13" cy="-34" r="5" fill="#1f2937"/>
    <path d="M-11 -16 Q0 -6 11 -16" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-44" y="10" width="88" height="86" rx="24" fill="#dc2626"/>
    <!-- medal -->
    <path d="M-20 10 L0 60 L20 10" fill="#fbbf24"/>
    <circle cx="0" cy="86" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="5"/>
    <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#92400e">1</text>
    <!-- arms up -->
    <path d="M-40 22 L-78 -16 M40 22 L78 -16" stroke="#fcd0ae" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- confetti -->
  <g>
    <rect x="180" y="120" width="12" height="22" rx="4" fill="#ef4444" transform="rotate(24 186 131)"/>
    <rect x="600" y="100" width="12" height="22" rx="4" fill="#3b82f6" transform="rotate(-18 606 111)"/>
    <rect x="260" y="70" width="12" height="22" rx="4" fill="#22c55e" transform="rotate(40 266 81)"/>
    <rect x="520" y="200" width="12" height="22" rx="4" fill="#a855f7" transform="rotate(-30 526 211)"/>
    <circle cx="160" cy="220" r="8" fill="#f59e0b"/>
    <circle cx="650" cy="260" r="8" fill="#ec4899"/>
  </g>
</svg>
