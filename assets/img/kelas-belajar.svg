      <path d="M-26 -34 A26 26 0 0 1 26 -34 L28 -48 A26 26 0 0 0 -28 -48 Z" fill="#4c2a12"/>
      <path d="M-30 0 h60 a0 0 0 0 1 0 0 v40 a14 14 0 0 1 -14 14 h-32 a14 14 0 0 1 -14 -14 z" fill="#7c3aed"/>
      <rect x="-30" y="-10" width="60" height="18" rx="9" fill="#7c3aed"/>
