<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg1)"/>
  <rect x="60" y="70" width="780" height="560" rx="28" fill="#fff" stroke="#dbeafe" stroke-width="4"/>
  <rect x="60" y="70" width="780" height="86" rx="28" fill="#1d4ed8"/>
  <rect x="60" y="128" width="780" height="28" fill="#1d4ed8"/>
  <text x="90" y="124" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#fff">Kelas 4 — Belajar Bersama</text>
  <circle cx="800" cy="113" r="18" fill="#fbbf24"/>

  <!-- blackboard -->
  <rect x="120" y="200" width="420" height="240" rx="14" fill="#14532d" stroke="#92400e" stroke-width="12"/>
  <text x="330" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#fff" font-weight="bold">2 + 3 = 5</text>
  <text x="330" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#dbeafe">A B C…</text>
  <text x="330" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#a7f3d0">Membaca itu menyenangkan!</text>

  <!-- bookshelf -->
  <rect x="600" y="210" width="200" height="240" rx="12" fill="#b45309"/>
  <g>
    <rect x="615" y="235" width="26" height="80" rx="4" fill="#ef4444"/>
    <rect x="645" y="245" width="26" height="70" rx="4" fill="#22c55e"/>
    <rect x="675" y="230" width="26" height="85" rx="4" fill="#3b82f6"/>
    <rect x="705" y="250" width="26" height="65" rx="4" fill="#f59e0b"/>
    <rect x="735" y="240" width="26" height="75" rx="4" fill="#a855f7"/>
    <rect x="615" y="350" width="26" height="75" rx="4" fill="#14b8a6"/>
    <rect x="645" y="360" width="26" height="65" rx="4" fill="#f97316"/>
    <rect x="675" y="345" width="26" height="80" rx="4" fill="#6366f1"/>
    <rect x="705" y="365" width="26" height="60" rx="4" fill="#e11d48"/>
    <rect x="735" y="355" width="26" height="70" rx="4" fill="#0ea5e9"/>
  </g>

  <!-- teacher -->
  <g transform="translate(240 500)">
    <circle cx="0" cy="-40" r="34" fill="#e8b48c"/>
    <path d="M-34 -46 A34 34 0 0 1 34 -46 L36 -60 A34 34 0 0 0 -36 -60 Z" fill="#1f2937"/>
    <circle cx="-11" cy="-44" r="3.4" fill="#1f2937"/>
    <circle cx="11" cy="-44" r="3.4" fill="#1f2937"/>
    <path d="M-10 -30 Q0 -22 10 -30" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-44" y="-6" width="88" height="110" rx="26" fill="#0f2a5c"/>
    <rect x="-74" y="0" width="30" height="80" rx="14" fill="#0f2a5c" transform="rotate(18 -74 0)"/>
    <rect x="46" y="-10" width="12" height="70" rx="6" fill="#e8b48c" transform="rotate(-30 46 -10)"/>
  </g>

  <!-- students row -->
  <g>
    <g transform="translate(430 545)">
      <circle cx="0" cy="-30" r="26" fill="#fcd0ae"/>
      <path d="M-26 -34 A26 26 0 0 1 26 -34 L26 -44 A26 26 0 0 0 -26 -44 Z" fill="#4c2a12"/>
      <rect x="-30" y="0" width="60" height="72" rx="20" fill="#dc2626"/>
    </g>
    <g transform="translate(540 550)">
      <circle cx="0" cy="-30" r="26" fill="#e8b48c"/>
      <path d="M-26 -34 A26 26 0 0 1 26 -34 L26 -44 A26 26 0 0 0 -26 -44 Z" fill="#111827"/>
