  <!-- desks -->
  <rect x="380" y="620" width="320" height="16" rx="8" fill="#b45309"/>
  <rect x="400" y="636" width="14" height="34" fill="#92400e"/>
  <rect x="666" y="636" width="14" height="34" fill="#92400e"/>
